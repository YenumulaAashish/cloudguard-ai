name: Offline Terraform security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CHECKPOINT_DISABLE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      TFLINT_AWS: '1'
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Verify reviewed credential-free CI contract
        run: python scripts/verify-hosted-ci.py
      - name: Terraform, lint, security, exception and policy gates
        run: python scripts/run-offline.py
      - name: Validate Phase 4 synthetic integration privately
        run: python scripts/verify-phase4-fixtures.py
      - name: Generate evidence even on gate failure
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python scripts/generate-evidence.py
      - name: Complete Phase 3 reporting even on gate failure
        id: phase3
        if: always()
        run: |
          python scripts/run-phase3.py --checkov reports/private/checkov-raw.json --current-evidence --mode offline
      - name: Upload bounded PR reporting artifacts
        if: always() && steps.phase3.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-summary-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            reports/sanitized/phase35/pr-summary.json
            reports/sanitized/phase35/pr-summary.md
            reports/sanitized/phase35/phase3-evidence.json
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: offline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            reports/phase2/summary.json
            reports/phase2/summary.md
            reports/phase2/checks.json
            reports/phase2/checkov.json
            reports/phase2/checkov-exceptions.json
            reports/phase2/policy-tests.json
            reports/phase2/ci-safety.json
