name: Offline Terraform security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TFLINT_AWS: '1'
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Terraform, lint, security, exception and policy gates
        run: python scripts/run-offline.py
      - name: Generate evidence even on gate failure
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python scripts/generate-evidence.py
      - name: Render sanitized PR summary even on gate failure
        if: always()
        run: |
          python scripts/normalize-findings.py --checkov reports/private/checkov-raw.json --output reports/private/phase34/normalized.json
          python scripts/score-risk.py --input reports/private/phase34/normalized.json --output reports/private/phase34/risk.json
          python scripts/analyze-security.py --findings reports/private/phase34/normalized.json --risk reports/private/phase34/risk.json --mode offline --output reports/private/phase34/advisory.json
          python scripts/render-pr-summary.py --findings reports/private/phase34/normalized.json --risk reports/private/phase34/risk.json --remediation reports/private/phase34/advisory.json --current-evidence --output reports/sanitized/pr-summary.json --markdown reports/sanitized/pr-summary.md
      - name: Upload bounded PR reporting artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-summary-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            reports/sanitized/pr-summary.json
            reports/sanitized/pr-summary.md
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: offline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            reports/phase2/summary.json
            reports/phase2/summary.md
            reports/phase2/checks.json
            reports/phase2/checkov.json
            reports/phase2/checkov-exceptions.json
            reports/phase2/policy-tests.json
            reports/phase2/ci-safety.json
