name: Offline Terraform security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TFLINT_AWS: '1'
      AWS_REGION: ap-south-1
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Terraform, lint, security, exception and policy gates
        run: python scripts/run-offline.py
      - name: Generate evidence even on gate failure
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: python scripts/generate-evidence.py
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: offline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            reports/phase2/summary.json
            reports/phase2/summary.md
            reports/phase2/checks.json
            reports/phase2/checkov.json
            reports/phase2/checkov-exceptions.json
            reports/phase2/policy-tests.json
            reports/phase2/ci-safety.json
